<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="45%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <!-- Glowing Outer Rim -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#0284C7" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#0F172A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Radial Cockpit Glow -->
    <radialGradient id="cockpitGlow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#0369A1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0"/>
    </radialGradient>

    <!-- Tachometer Speed Arc Gradient -->
    <linearGradient id="tachoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="75%" stop-color="#10B981"/>
      <stop offset="92%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <!-- Cyan Ribbon Gradient for 'e' -->
    <linearGradient id="eGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Metallic White Gradient for 'G' and 'M' -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Speed Needle Gradient -->
    <linearGradient id="needleGlowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="90%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- 1. Squircle App Badge -->
  <rect x="18" y="18" width="476" height="476" rx="112" ry="112" fill="url(#bgGrad)"/>
  <rect x="18" y="18" width="476" height="476" rx="112" ry="112" fill="url(#cockpitGlow)"/>
  <rect x="18" y="18" width="476" height="476" rx="112" ry="112" fill="none" stroke="url(#rimGrad)" stroke-width="3"/>

  <!-- 2. Automotive Speedometer Gauge Arc (Outer HUD Ring) -->
  <!-- Center: 256, 260, Radius: 196 -->
  <!-- Dark Track -->
  <path d="M 118 400 A 196 196 0 1 1 394 400"
        fill="none" stroke="#1E293B" stroke-width="12" stroke-linecap="round"/>

  <!-- Active Illuminated Speed Arc -->
  <path d="M 118 400 A 196 196 0 1 1 372 165"
        fill="none" stroke="url(#tachoGrad)" stroke-width="12" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- Redline Alert Zone (End of Arc) -->
  <path d="M 372 165 A 196 196 0 0 1 394 400"
        fill="none" stroke="#EF4444" stroke-width="12" stroke-linecap="round" opacity="0.9" filter="url(#softGlow)"/>

  <!-- Speedometer Radial Tick Marks -->
  <!-- Start (0 km/h) -->
  <line x1="134" y1="384" x2="148" y2="372" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- 30 km/h -->
  <line x1="102" y1="300" x2="118" y2="296" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <!-- 50 km/h -->
  <line x1="112" y1="210" x2="128" y2="216" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <!-- 70 km/h (Top) -->
  <line x1="256" y1="68" x2="256" y2="86" stroke="#67E8F9" stroke-width="4.5" stroke-linecap="round" filter="url(#softGlow)"/>
  <!-- 100 km/h -->
  <line x1="384" y1="210" x2="368" y2="216" stroke="#10B981" stroke-width="3.5" stroke-linecap="round"/>
  <!-- 120 km/h Redline -->
  <line x1="394" y1="300" x2="378" y2="296" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Mini Speed Limit Sign ("70" / "GM") in Top-Right Corner -->
  <g transform="translate(398, 96)" filter="url(#cardShadow)">
    <circle cx="0" cy="0" r="22" fill="#DC2626"/>
    <circle cx="0" cy="0" r="16.5" fill="#FFFFFF"/>
    <text x="0" y="6" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="-0.5">70</text>
  </g>

  <!-- 3. Central Monogram Lockup: "eGM" -->
  <g filter="url(#cardShadow)">

    <!-- Letter 'e' (Electric Cyan Dynamic Tech Curve) -->
    <!-- Center x: 122, Top y: 226, Bottom y: 354, Width: 84 -->
    <path d="M 160 292
             L 86 292
             C 86 244 114 224 148 224
             C 172 224 178 238 178 250
             M 164 292
             C 164 340 134 354 104 354
             C 88 354 78 348 74 340"
          fill="none" stroke="url(#eGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
    <circle cx="160" cy="292" r="12" fill="#38BDF8"/>

    <!-- Letter 'G' (Modern Geometric White with Tachometer Crossbar Needle) -->
    <!-- Outer Arc of G: from (292, 252) around to (292, 320) -->
    <path d="M 288 248
             C 274 232 254 224 230 224
             C 186 224 156 258 156 304
             C 156 350 186 384 232 384
             C 272 384 298 358 300 318
             L 242 318"
          fill="none" stroke="url(#metalGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- The Illuminated Tachometer Needle launching from the G's Crossbar -->
    <!-- Pivot hub at (242, 318), pointing dynamically upwards to (328, 198) -->
    <g filter="url(#neonGlow)">
      <!-- Needle blade -->
      <polygon points="238,324 246,312 334,194 324,204" fill="url(#needleGlowGrad)"/>
      <!-- Glowing Pivot Hub -->
      <circle cx="242" cy="318" r="9" fill="#0284C7"/>
      <circle cx="242" cy="318" r="4.5" fill="#FFFFFF"/>
      <!-- Red Hot Needle Tip -->
      <circle cx="330" cy="198" r="4" fill="#EF4444"/>
    </g>

    <!-- Letter 'M' (Speed-Angled Clean Geometric Monogram) -->
    <!-- Left upright (336, 354 to 336, 226), center peak (380, 312), right upright (424, 226 to 424, 354) -->
    <path d="M 338 354
             L 338 226
             L 382 312
             L 426 226
             L 426 354"
          fill="none" stroke="url(#metalGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 4. Sub-Brand Label & Details -->
  <!-- "ENHANCED GM" in wide-spaced futuristic typography -->
  <text x="256" y="440"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="15"
        font-weight="800"
        letter-spacing="9"
        fill="#94A3B8"
        text-anchor="middle">ENHANCED GM</text>

  <!-- Small Glowing Navigation GPS Pulse / Compass Dot -->
  <circle cx="256" cy="464" r="3.5" fill="#38BDF8" filter="url(#softGlow)"/>
  <circle cx="256" cy="464" r="7" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.5"/>
</svg>
